worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # The root filesystem is read-only: every writable path lives on the /tmp tmpfs.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # Slow-client (slowloris) and oversized-request protection.
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;
    # Same limit as the API's BODY_LIMIT_BYTES (16384).
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml text/plain;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $uri $static_cache_control {
        ~^/assets/ "public, max-age=31536000, immutable";
        default "no-cache";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        limit_conn conn_per_ip 20;

        # Docker's embedded DNS, re-resolved so a recreated api container (new IP) keeps working.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;

        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cache-Control $static_cache_control always;
            try_files $uri /index.html;

            # A missing hashed asset must be a 404, never index.html served as JavaScript.
            location /assets/ {
                try_files $uri =404;
            }
        }

        location /api/ {
            limit_req zone=api_per_ip burst=30 nodelay;

            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Overwritten, not appended: a client-supplied X-Forwarded-For would let it pick
            # the IP the API rate-limits by.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            error_page 413 = @payload_too_large;
            error_page 429 = @rate_limited;
            error_page 502 503 504 = @api_unavailable;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Same RFC 9457 shape as the API's own errors, so the front handles them uniformly.
        location @payload_too_large {
            default_type application/problem+json;
            return 413 '{"type":"urn:scheduling:problem:payload-too-large","title":"Requisição grande demais","status":413,"code":"PAYLOAD_TOO_LARGE","detail":"O corpo da requisição excede o tamanho permitido."}';
        }

        location @rate_limited {
            default_type application/problem+json;
            add_header Retry-After 1 always;
            return 429 '{"type":"urn:scheduling:problem:rate-limited","title":"Muitas requisições","status":429,"code":"RATE_LIMITED","detail":"Muitas requisições. Aguarde um instante e tente novamente."}';
        }

        location @api_unavailable {
            default_type application/problem+json;
            add_header Retry-After 5 always;
            return 503 '{"type":"urn:scheduling:problem:service-unavailable","title":"Serviço indisponível","status":503,"code":"SERVICE_UNAVAILABLE","detail":"O serviço está temporariamente indisponível. Tente novamente em instantes."}';
        }
    }
}
